{% extends 'base.html' %}

{% block title %}Buat Postingan{% endblock %}

{% block content %}
<div class="card bg-neutral shadow-xl max-w-3xl mx-auto">
    <div class="card-body">
        <h2 class="card-title text-2xl text-primary mb-6">Create New Post</h2>
        
        <form method="post" action="{% url 'create_post' %}" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-control mb-4">
                <label class="label">
                    <span class="label-text">Title</span>
                </label>
                <input type="text" name="title" placeholder="Enter post title" class="input input-bordered" required />
            </div>
            
            <div class="form-control mb-4">
                <label class="label">
                    <span class="label-text">Categories</span>
                    <span class="label-text-alt">Separate with spaces (e.g. "Technology Travel Personal")</span>
                </label>
                <div class="relative">
                    <input type="text" name="categories" id="categories" placeholder="Enter categories" class="input input-bordered w-full" />
                    <div id="categoryDropdown" class="absolute z-10 bg-base-300 w-full mt-1 rounded-lg shadow-lg hidden"></div>
                </div>
            </div>
            
            <div class="form-control mb-4">
                <label class="label">
                    <span class="label-text">Actresses</span>
                    <span class="label-text-alt">People who appear in the images (separate with spaces)</span>
                </label>
                <input type="text" name="actresses" placeholder="Enter actresses" class="input input-bordered" />
            </div>
            
            <div class="form-control mb-4">
                <label class="label">
                    <span class="label-text">Download Links</span>
                    <span class="label-text-alt">Add download links for your content</span>
                </label>
                <div id="downloadLinks">
                    <div class="download-link-row flex flex-wrap gap-2 mb-2">
                        <select name="download_host_type" class="select select-bordered flex-1">
                            {% for host_type in host_types %}
                            <option value="{{ host_type.id }}">{{ host_type.name }}</option>
                            {% endfor %}
                        </select>
                        <input type="url" name="download_url" placeholder="Enter download URL" class="input input-bordered flex-grow" />
                    </div>
                </div>
                <button type="button" id="addDownloadLink" class="btn btn-outline btn-sm mt-2">Add Another Link</button>
            </div>
            
            <div class="form-control mb-6">
                <label class="label">
                    <span class="label-text">Images</span>
                    <span class="label-text-alt">Select an image to make it the thumbnail</span>
                </label>
                <input type="file" name="images" multiple class="file-input file-input-bordered file-input-primary w-full" accept="image/*" required />
                <input type="hidden" name="thumbnail_index" id="thumbnail_index" value="0" />
                <div id="imagePreview" class="grid grid-cols-3 gap-2 mt-2"></div>
                <div id="thumbnailSelection" class="mt-2"></div>
            </div>
            
            <div class="form-control flex-row justify-end gap-2">
                <a href="{% url 'blog' %}" class="btn btn-outline">Cancel</a>
                <button type="submit" class="btn btn-primary">Publish Post</button>
            </div>
        </form>
    </div>
</div>

<script>
    // Category autocomplete functionality
    const categoryInput = document.getElementById('categories');
    const categoryDropdown = document.getElementById('categoryDropdown');
    
    categoryInput.addEventListener('input', function() {
        const query = this.value.split(' ').pop();
        
        if (query.length > 0) {
            fetch(`/api/categories/?q=${query}`)
                .then(response => response.json())
                .then(data => {
                    categoryDropdown.innerHTML = '';
                    
                    if (data.length > 0) {
                        categoryDropdown.classList.remove('hidden');
                        
                        data.forEach(category => {
                            const item = document.createElement('div');
                            item.className = 'p-2 hover:bg-base-100 cursor-pointer';
                            item.textContent = category;
                            
                            item.addEventListener('click', function() {
                                const currentValue = categoryInput.value;
                                const terms = currentValue.split(' ');
                                terms.pop();
                                terms.push(category);
                                categoryInput.value = terms.join(' ') + ' ';
                                categoryDropdown.classList.add('hidden');
                                categoryInput.focus();
                            });
                            
                            categoryDropdown.appendChild(item);
                        });
                    } else {
                        categoryDropdown.classList.add('hidden');
                    }
                });
        } else {
            categoryDropdown.classList.add('hidden');
        }
    });
    
    document.addEventListener('click', function(e) {
        if (!categoryInput.contains(e.target) && !categoryDropdown.contains(e.target)) {
            categoryDropdown.classList.add('hidden');
        }
    });
    
    // Image preview functionality
    const imageInput = document.querySelector('input[name="images"]');
    const imagePreview = document.getElementById('imagePreview');
    const thumbnailSelection = document.getElementById('thumbnailSelection');
    const thumbnailIndexInput = document.getElementById('thumbnail_index');
    
    imageInput.addEventListener('change', function() {
        imagePreview.innerHTML = '';
        thumbnailSelection.innerHTML = '';
        
        if (this.files) {
            // Create a heading for the thumbnails
            const heading = document.createElement('div');
            heading.className = 'mt-4 mb-2 font-semibold text-primary';
            heading.textContent = 'Click on an image to set it as the thumbnail:';
            thumbnailSelection.appendChild(heading);
            
            Array.from(this.files).forEach((file, index) => {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    const previewContainer = document.createElement('div');
                    previewContainer.className = 'relative group cursor-pointer border-2 border-transparent hover:border-primary rounded-lg transition-all duration-200';
                    previewContainer.dataset.index = index;
                    
                    // Add click event to set as thumbnail
                    previewContainer.addEventListener('click', function() {
                        // Remove active class from all containers
                        document.querySelectorAll('#imagePreview > div').forEach(div => {
                            div.classList.remove('border-primary');
                            div.classList.add('border-transparent');
                            // Remove any existing thumbnail badges
                            const badge = div.querySelector('.thumbnail-badge');
                            if (badge) badge.remove();
                        });
                        
                        // Add active class to this container
                        this.classList.remove('border-transparent');
                        this.classList.add('border-primary');
                        
                        // Add thumbnail badge
                        const badge = document.createElement('div');
                        badge.className = 'absolute top-1 left-1 badge badge-primary thumbnail-badge';
                        badge.textContent = 'Thumbnail';
                        this.appendChild(badge);
                        
                        // Update hidden input
                        thumbnailIndexInput.value = this.dataset.index;
                    });
                    
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = 'w-full h-24 object-cover rounded-lg';
                    img.alt = `Preview ${index + 1}`;
                    
                    previewContainer.appendChild(img);
                    imagePreview.appendChild(previewContainer);
                    
                    // Set the first image as thumbnail by default
                    if (index === 0) {
                        previewContainer.click();
                    }
                };
                
                reader.readAsDataURL(file);
            });
        }
    });
</script>

<script>
    // Download links functionality
    document.addEventListener('DOMContentLoaded', function() {
        const downloadLinksContainer = document.getElementById('downloadLinks');
        const addDownloadLinkButton = document.getElementById('addDownloadLink');
        
        addDownloadLinkButton.addEventListener('click', function() {
            const newRow = document.createElement('div');
            newRow.className = 'download-link-row flex flex-wrap gap-2 mb-2';
            
            // Clone the select element from the first row
            const firstSelect = downloadLinksContainer.querySelector('select');
            const newSelect = firstSelect.cloneNode(true);
            newSelect.name = 'download_host_type';
            
            // Create new input for URL
            const newInput = document.createElement('input');
            newInput.type = 'url';
            newInput.name = 'download_url';
            newInput.placeholder = 'Enter download URL';
            newInput.className = 'input input-bordered flex-grow';
            
            // Create remove button
            const removeButton = document.createElement('button');
            removeButton.type = 'button';
            removeButton.className = 'btn btn-error btn-square';
            removeButton.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>';
            removeButton.addEventListener('click', function() {
                newRow.remove();
            });
            
            // Add elements to the row
            newRow.appendChild(newSelect);
            newRow.appendChild(newInput);
            newRow.appendChild(removeButton);
            
            // Add the row to the container
            downloadLinksContainer.appendChild(newRow);
        });
    });
</script>
{% endblock %}
