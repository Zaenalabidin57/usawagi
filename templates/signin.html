{% extends 'base.html' %}

{% block title %}Login dsw{% endblock %}

{% block content %}
<div class="flex justify-center items-center my-8">
    <div class="card w-full max-w-md bg-neutral shadow-xl">
        <div class="card-body">
            <h2 class="card-title text-2xl text-primary justify-center mb-6">Sign In</h2>
            
            <form method="post" action="{% url 'signin' %}">
                {% csrf_token %}
                <div class="form-control mb-4">
                    <label class="label">
                        <span class="label-text">Username</span>
                    </label>
                    <input type="text" name="username" placeholder="Username" class="input input-bordered" required />
                </div>
                
                <div class="form-control mb-6">
                    <label class="label">
                        <span class="label-text">Password</span>
                    </label>
                    <input type="password" name="password" placeholder="Password" class="input input-bordered" required />
                    <label class="label">
                        <a href="#" class="label-text-alt link link-hover text-primary">Forgorn 💀</a>
                    </label>
                </div>
                
                <div class="form-control">
                    <button type="submit" class="btn btn-primary">Login</button>
                </div>
            </form>
            
            <div class="divider my-4">OR</div>
            
            <p class="text-center">Gapunya akun? bikin aja langsung <a href="{% url 'signup' %}" class="text-primary hover:underline">Join</a></p>
        </div>
    </div>
</div>
{% endblock %}
