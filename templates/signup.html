{% extends 'base.html' %}

{% block title %}Sign Up - Cute Blog{% endblock %}

{% block content %}
<div class="flex justify-center items-center my-8">
    <div class="card w-full max-w-md bg-neutral shadow-xl">
        <div class="card-body">
            <h2 class="card-title text-2xl text-primary justify-center mb-6">Create an Account</h2>
            
            <form method="post" action="{% url 'signup' %}">
                {% csrf_token %}
                <div class="form-control mb-4">
                    <label class="label">
                        <span class="label-text">Username</span>
                    </label>
                    <input type="text" name="username" placeholder="Username" class="input input-bordered" required />
                </div>
                
                <div class="form-control mb-4">
                    <label class="label">
                        <span class="label-text">Email</span>
                    </label>
                    <input type="email" name="email" placeholder="Email" class="input input-bordered" required />
                </div>
                
                <div class="form-control mb-4">
                    <label class="label">
                        <span class="label-text">Password</span>
                    </label>
                    <input type="password" name="password" placeholder="Password" class="input input-bordered" required />
                </div>
                
                <div class="form-control mb-6">
                    <label class="label">
                        <span class="label-text">Confirm Password</span>
                    </label>
                    <input type="password" name="password2" placeholder="Confirm Password" class="input input-bordered" required />
                </div>
                
                <div class="form-control">
                    <button type="submit" class="btn btn-primary">Sign Up</button>
                </div>
            </form>
            
            <div class="divider my-4">OR</div>
            
            <p class="text-center">Already have an account? <a href="{% url 'signin' %}" class="text-primary hover:underline">Sign In</a></p>
        </div>
    </div>
</div>
{% endblock %}
