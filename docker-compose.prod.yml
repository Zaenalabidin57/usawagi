version: '3.8'

services:
  web:
    build: .
    restart: always
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
      - sqlite_data:/app/database
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-your_secret_key_here}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-yourdomain.com,www.yourdomain.com}
      - ENVIRONMENT=production
    command: gunicorn --bind 0.0.0.0:8000 cuteblog.wsgi:application

  nginx:
    image: nginx:alpine
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "80:80"
    depends_on:
      - web

volumes:
  static_volume:
  media_volume:
  sqlite_data:
